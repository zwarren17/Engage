const bills=[{id:'F-104',code:'H.R. 104',title:'Community Broadband Access Act',category:'Technology',level:'Federal',status:'In committee',description:'Creates a grant program to help underserved communities improve broadband infrastructure.',simple:'This proposal would establish federal grants for local broadband projects in places with limited internet access. It also sets reporting requirements for organizations receiving funding.',provisions:['Establishes a competitive federal grant program for broadband infrastructure.','Prioritizes proposed projects serving communities with limited access.','Requires grant recipients to report how funds are spent and project progress.'],benefits:['Could help qualifying communities fund internet infrastructure.','Public reporting could improve transparency around awarded grants.'],concerns:['The program would require federal funding and administration.','Eligibility and implementation details could affect which communities receive support.'],stage:2},{id:'S-218',code:'S. 218',title:'Student Data Privacy Modernization Act',category:'Education',level:'Federal',status:'Introduced',description:'Proposes updated data-handling standards for educational technology providers.',simple:'This bill would require certain education technology companies to describe how they collect and use student information and would establish additional restrictions on sharing covered student data.',provisions:['Requires covered services to publish accessible data-use notices.','Limits certain third-party sharing of student data.','Creates compliance reporting requirements.'],benefits:['Could give families more information about how student data is used.','Could establish clearer obligations for covered providers.'],concerns:['Compliance costs could be significant for smaller providers.','The specific definitions of covered data could affect the scope of protection.'],stage:1},{id:'NY-452',code:'N.Y. A. 452',title:'Clean Transit Infrastructure Program',category:'Environment',level:'New York',status:'Floor calendar',description:'Establishes a state assistance program for lower-emission public transit investments.',simple:'This state proposal would provide eligible transit agencies with support for purchasing cleaner vehicles and upgrading facilities, subject to funding and program rules.',provisions:['Establishes a state assistance program for eligible transit operators.','Permits spending on specified vehicle and facility upgrades.','Requires annual program progress reports.'],benefits:['Could help participating agencies upgrade aging fleets.','Could support air-quality improvements where vehicles are replaced.'],concerns:['Program costs would depend on appropriations and project selection.','Agencies might face facility or maintenance transition challenges.'],stage:3},{id:'NY-611',code:'N.Y. S. 611',title:'Tenant Fee Disclosure Act',category:'Housing',level:'New York',status:'In committee',description:'Requires advance written disclosure of specified residential rental fees.',simple:'This proposal would require certain rental fees to be clearly disclosed before a tenant agrees to a lease. It would also establish a process for addressing violations.',provisions:['Requires itemized disclosure of covered fees before lease execution.','Sets rules for presenting mandatory charges.','Provides for enforcement by designated state authorities.'],benefits:['Could make the full cost of renting easier to compare.','Could reduce disputes arising from undisclosed fees.'],concerns:['Property managers may need to change listing and lease processes.','The effect on overall rental costs is uncertain.'],stage:2},{id:'F-326',code:'H.R. 326',title:'Rural Health Access Improvement Act',category:'Healthcare',level:'Federal',status:'Passed chamber',description:'Creates incentives for participating rural health facilities to expand selected services.',simple:'The bill would establish incentives for qualifying rural health providers to offer additional services and would require reporting on program outcomes.',provisions:['Creates a program for certain rural healthcare facilities.','Defines eligible service expansion activities.','Requires agency reporting on spending and access measures.'],benefits:['Could help qualifying facilities offer more local services.','Outcome reporting could assist future program evaluation.'],concerns:['Available funding may not cover all qualifying facilities.','Staffing and operational constraints could limit implementation.'],stage:4},{id:'NY-733',code:'N.Y. A. 733',title:'Public Library Digital Resources Act',category:'Education',level:'New York',status:'Introduced',description:'Proposes state grants for public-library digital access and technology education.',simple:'This measure would let eligible public libraries seek state funds to expand device access and technology training for patrons.',provisions:['Authorizes grants for eligible library technology resources.','Allows grant funds to support specified digital-skills programs.','Requires basic annual outcome reporting.'],benefits:['Could expand access to devices and digital training.','May help public libraries meet community technology needs.'],concerns:['The impact depends on grant funding and local capacity.','Reporting could create additional administrative tasks.'],stage:1}];
const reps=[{id:1,name:'Alex Morgan',initials:'AM',role:'U.S. House · Sample district',party:'Independent',jurisdiction:'Federal',votes:[['Rural Health Access Improvement Act','Yes'],['Community Broadband Access Act','No recorded vote'],['Public Services Funding Resolution','Yes']]},{id:2,name:'Jordan Ellis',initials:'JE',role:'U.S. Senate · Sample seat',party:'Independent',jurisdiction:'Federal',votes:[['Student Data Privacy Modernization Act','No recorded vote'],['Public Services Funding Resolution','No']]},{id:3,name:'Taylor Reed',initials:'TR',role:'State Assembly · Sample district',party:'Independent',jurisdiction:'New York',votes:[['Clean Transit Infrastructure Program','No recorded vote'],['Tenant Fee Disclosure Act','No recorded vote']]},{id:4,name:'Casey Brooks',initials:'CB',role:'State Senate · Sample district',party:'Independent',jurisdiction:'New York',votes:[['Public Library Digital Resources Act','No recorded vote'],['State Transportation Resolution','Yes']]}];
const stored=(k,d)=>{try{return JSON.parse(localStorage.getItem('engage_'+k))??d}catch{return d}};let state={page:'home',billId:null,filter:'All',search:'',saved:stored('saved',[]),votes:stored('votes',{}),challengeDone:stored('challengeDone',false),challengeAnswer:null,streak:stored('streak',0),modal:null,repId:null};const persist=(k,v)=>{try{localStorage.setItem('engage_'+k,JSON.stringify(v))}catch{}};const icon={home:'⌂',bills:'▤',reps:'♙',pulse:'◔',daily:'✦',saved:'♧'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const points=()=>100+Object.keys(state.votes).length*15+(state.challengeDone?30:0)+state.saved.length*5;const pct=()=>Math.min(100,Math.round(points()/350*100));
function nav(page,label){return `<button class="navbtn ${state.page===page?'active':''}" data-page="${page}"><span class="ico">${icon[page]}</span>${label}</button>`}function cardBill(b){return `<div class="card bill"><div class="billhead"><span class="tag ${b.level==='New York'?'green':''}">${b.level}</span><button class="bookmark ${state.saved.includes(b.id)?'saved':''}" data-save="${b.id}" aria-label="Bookmark ${esc(b.title)}">${state.saved.includes(b.id)?'♥':'♡'}</button></div><div><small style="color:#195ed3;font-weight:800">${b.code} · ${b.category}</small><h3>${b.title}</h3></div><p>${b.description}</p><div class="billfoot"><small>◷ ${b.status}</small><button class="textlink" data-bill="${b.id}">Legixsplain →</button></div></div>`}function stat(label,value,detail){return `<div class="card stat"><small>${label}</small><strong>${value}</strong><span class="detail">${detail}</span></div>`}function section(title,link,page){return `<div class="section-head"><h3>${title}</h3>${link?`<button class="textlink" data-page="${page}">${link} →</button>`:''}</div>`}
function home(){return `<div class="eyebrow">YOUR CIVIC DASHBOARD</div><h1 class="page-title">Good afternoon, Citizen</h1><p class="subtitle">Know More. Engage More.</p><div class="hero"><div class="hero-copy"><div class="eyebrow">✦ KNOW MORE. ENGAGE MORE.</div><h2>Democracy works better<br>when you're in the loop.</h2><p>Break down complex legislation into clear, understandable facts, and make your voice part of the conversation.</p><button class="btn white" data-page="bills">Explore legislation →</button></div></div><div class="stats">${stat('YOUR CIVIC SCORE',points(),'↗ Keep learning and engaging')}${stat('BILLS EXPLORED',Object.keys(state.votes).length,'Your recorded opinions')}${stat('DAILY STREAK',state.streak+' days','✦ Daily engagement')}${stat('SAVED BILLS',state.saved.length,'Your reading list')}</div><div class="grid cols-main"><div>${section('Legislation worth exploring','See all bills','bills')}<div class="grid cols-2">${bills.slice(0,2).map(cardBill).join('')}</div>${section('Your representatives','Meet them','reps')}<div class="card">${reps.slice(0,3).map(rep=>`<div class="mini-rep"><div class="repavatar">${rep.initials}</div><div style="flex:1"><strong>${rep.name}</strong><small>${rep.role}</small></div><button class="textlink" data-rep="${rep.id}">Profile →</button></div>`).join('')}</div></div><div>${section('Daily Engagement','Open challenge','daily')}<div class="card challenge"><span class="challenge-badge">✦ TODAY'S CHALLENGE</span><h3>One minute to be a more informed citizen.</h3><p>Learn a civic fact, answer a quick question, and build your engagement streak.</p><div class="streak"><div><strong>🔥 ${state.streak} day streak</strong><br><small>Keep your learning habit going</small></div><strong>+30 pts</strong></div><button class="btn primary" data-page="daily" style="width:100%">${state.challengeDone?'See your result':'Take today’s challenge'} →</button></div>${section('Public Pulse','Explore opinion','pulse')}<div class="card"><small style="color:#8895a0;font-weight:750">SAMPLE COMMUNITY RESPONSES</small><h3 style="font-size:15px;line-height:1.4">How do people feel about the Broadband Access Act?</h3>${pulseBar('F-104')}<p style="color:#93a0a8;font-size:10px;line-height:1.5">Illustrative response data and your local demo votes. Not a scientific poll.</p><button class="btn outline" data-page="pulse">Explore Public Pulse →</button></div></div></div>`}
function listBills(){let result=bills.filter(b=>(state.filter==='All'||b.level===state.filter||b.category===state.filter)&&(`${b.title} ${b.code} ${b.description} ${b.category}`.toLowerCase().includes(state.search.toLowerCase())));return `<div class="eyebrow">LEGIXSPLAIN // YOUR GOVERNMENT, DECODED.</div><h1 class="page-title">Legislation, without the legalese.</h1><p class="subtitle">Explore proposals, understand their provisions, and draw your own conclusions.</p><div class="searchrow"><input class="search" id="billSearch" placeholder="⌕  Search legislation, topics, bill numbers..." value="${esc(state.search)}" aria-label="Search bills"><select class="filter" id="billFilter" aria-label="Filter bills">${['All','Federal','New York','Technology','Education','Environment','Housing','Healthcare'].map(o=>`<option ${o===state.filter?'selected':''}>${o}</option>`).join('')}</select></div><div class="grid billgrid">${result.map(cardBill).join('')||'<div class="card empty">No bills found. Try another search or category.</div>'}</div><p class="subtitle" style="font-size:11px;margin-top:25px">All proposals in this prototype are fictional demonstrations, including bill numbers and statuses.</p>`}
function billDetail(){let b=bills.find(x=>x.id===state.billId)||bills[0];return `<div class="bill-detail"><button class="back" data-page="bills">← Back to legislation</button><div class="detail-top"><span class="tag ${b.level==='New York'?'green':''}">${b.level}</span><span class="tag orange">${b.status}</span><small style="color:#758b9d;font-weight:800">${b.code} · DEMO</small></div><h1 class="page-title" style="font-size:30px;margin-top:15px">${b.title}</h1><p class="subtitle">${b.category} · Illustrative legislative proposal</p><div class="summary-box"><strong>✦ LEGIXSPLAIN · YOUR GOVERNMENT, DECODED. · THE 30-SECOND VERSION</strong>${b.simple}</div><div class="card"><div class="detail-section" style="margin-top:0"><h3>What would this bill do?</h3><ul>${b.provisions.map(s=>`<li>${s}</li>`).join('')}</ul></div><div class="two-panel"><div class="panel"><h4>✓ Potential benefits</h4><ul>${b.benefits.map(s=>`<li>${s}</li>`).join('')}</ul></div><div class="panel"><h4>◷ Considerations and concerns</h4><ul>${b.concerns.map(s=>`<li>${s}</li>`).join('')}</ul></div></div><div class="detail-section"><h3>Where does it stand?</h3><div class="progress"><div style="width:${b.stage*20}%"></div></div><p>Current demo status: <b>${b.status}</b>. Legislative stages shown are illustrative and are not live updates.</p></div><div class="source-note">ⓘ Prototype transparency: This is a fictional bill. No authoritative bill text, legal citations, or AI verification has been connected yet. Production Legixsplain will link every material claim to government sources.</div></div><div class="card" style="margin-top:17px"><h3 style="margin-top:0">What's your view?</h3><p class="subtitle" style="margin-bottom:14px">Record your own opinion. Your view is yours to decide.</p>${voteButtons(b.id)}<div style="margin-top:20px">${pulseBar(b.id)}</div><button class="btn ghost" data-save="${b.id}" style="margin-top:12px">${state.saved.includes(b.id)?'♥ Saved to reading list':'♡ Save for later'}</button></div></div>`}
function voteButtons(id){return `<div class="vote-controls">${[['support','✓ Support'],['oppose','✕ Oppose'],['undecided','○ Undecided']].map(([v,l])=>`<button class="vote ${state.votes[id]===v?'selected':''}" data-vote="${id}:${v}">${l}</button>`).join('')}</div>`}function percentages(id){let base=id==='F-104'?[62,25,13]:id==='NY-452'?[55,32,13]:[45,39,16];return base}function pulseBar(id){let [a,b,c]=percentages(id);return `<div class="pulse-big"><span style="width:${a}%;background:#35a77d"></span><span style="width:${b}%;background:#e6a66d"></span><span style="width:${c}%;background:#bac7d2"></span></div><div class="legend"><span><i style="background:#35a77d"></i>Support ${a}%</span><span><i style="background:#e6a66d"></i>Oppose ${b}%</span><span><i style="background:#bac7d2"></i>Undecided ${c}%</span></div>`}
function repsPage(){return `<div class="eyebrow">YOUR REPRESENTATIVES</div><h1 class="page-title">Know who represents you.</h1><p class="subtitle">Explore legislative activity and ways to make your voice heard. Profiles below are fictional examples.</p><div class="grid cols-2">${reps.map(rep=>`<div class="card rep-card"><div class="repavatar">${rep.initials}</div><div><span class="tag ${rep.jurisdiction==='New York'?'green':''}">${rep.jurisdiction}</span></div><h3>${rep.name}</h3><p>${rep.role}</p><p>Party affiliation: ${rep.party} · Demo profile</p><div class="billfoot"><button class="btn outline" data-rep="${rep.id}">View voting history →</button><button class="btn ghost" data-contact="${rep.id}">✉ Contact</button></div></div>`).join('')}</div><p class="subtitle" style="font-size:11px;margin-top:25px">Representative identification will eventually use your district and verified official government directories, with privacy protections for location information.</p>`}
function repDetail(){let rep=reps.find(r=>r.id===state.repId)||reps[0];return `<div class="bill-detail"><button class="back" data-page="reps">← All representatives</button><div class="card"><div style="display:flex;gap:17px;align-items:center"><div class="repavatar" style="width:75px;height:75px;font-size:25px">${rep.initials}</div><div><span class="tag">Fictional profile</span><h1 class="page-title" style="font-size:24px">${rep.name}</h1><p class="subtitle" style="margin:0">${rep.role}</p></div></div><div class="section-head"><h3>Voting history</h3></div>${rep.votes.map(([name,v])=>`<div class="history-item"><span>${name}</span><span class="tag ${v==='Yes'?'green':v==='No'?'orange':'grey'}">${v}</span></div>`).join('')}<div class="source-note" style="margin-top:20px">These votes are illustrative and do not describe any real elected official.</div><button class="btn primary" style="margin-top:20px" data-contact="${rep.id}">✉ Draft a message</button></div></div>`}
function pulsePage(){return `<div class="eyebrow">PUBLIC PULSE</div><h1 class="page-title">Your opinion belongs in the conversation.</h1><p class="subtitle">Explore community sentiment and share your own perspective on legislation.</p><div class="card" style="margin-bottom:19px"><strong>How Public Pulse works</strong><p class="subtitle" style="margin:8px 0 0">These percentages are sample graphics, not measurements of public opinion. Your selections are stored only in this browser for the prototype. Future verified results will disclose sample size, methodology, and limitations.</p></div><div class="grid cols-2">${bills.slice(0,4).map(b=>`<div class="card"><div class="billhead"><span class="tag ${b.level==='New York'?'green':''}">${b.level}</span><small style="color:#8293a0">${b.code}</small></div><h3 style="font:800 16px Manrope,sans-serif">${b.title}</h3>${pulseBar(b.id)}${voteButtons(b.id)}<div style="margin-top:13px"><button class="textlink" data-bill="${b.id}">Read Legixsplain →</button></div></div>`).join('')}</div>`}
function dailyPage(){let choices=['A proposal automatically becomes law when it is introduced.','A proposal may be reviewed and changed in a legislative committee.','Every introduced proposal receives a full chamber vote.'];return `<div class="daily-wrap"><div class="eyebrow" style="text-align:center">DAILY ENGAGEMENT</div><div class="daily-hero"><div class="bigicon">✦</div><h2>Small steps. Stronger civic habits.</h2><p>Build a habit of understanding how your government works.<br>Every completed challenge adds to your Civic Score.</p><div style="font-weight:800;color:#6b5f9c">🔥 ${state.streak} day streak &nbsp; · &nbsp; ${points()} civic points</div></div><div class="card question-card"><span class="tag">CIVICS BASICS · DAY 1</span><h3 style="font:800 19px/1.5 Manrope,sans-serif;margin:19px 0 8px">What happens to a bill after it is introduced?</h3><p class="subtitle">Choose the most accurate answer.</p>${choices.map((c,i)=>`<button class="answerbtn ${state.challengeAnswer===i?'chosen':''} ${state.challengeDone&&i===1?'correct':''} ${state.challengeDone&&state.challengeAnswer===i&&i!==1?'wrong':''}" data-answer="${i}" ${state.challengeDone?'disabled':''}>${String.fromCharCode(65+i)}. ${c}</button>`).join('')}${state.challengeDone?`<div class="result"><strong>${state.challengeAnswer===1?'✓ Correct!':'Challenge completed!'}</strong><br>Bills can be referred to committees, which may hold hearings, consider amendments, and decide whether to advance them. Procedures vary by legislature.<br><br>✦ +30 Civic Score points awarded for participation.</div>`:`<button class="btn primary" id="submitDaily" style="margin-top:18px;width:100%" ${state.challengeAnswer===null?'disabled':''}>Submit my answer →</button>`}</div><div class="card" style="margin-top:17px"><div style="display:flex;justify-content:space-between"><b>Your Civic Score</b><b>${points()} pts</b></div><div class="progress" style="margin-top:13px"><div style="width:${pct()}%"></div></div><p class="subtitle" style="font-size:11px;margin:11px 0 0">Earn points for learning, sharing your opinion, and saving bills — regardless of political stance.</p></div></div>`}
function savedPage(){return `<div class="eyebrow">YOUR READING LIST</div><h1 class="page-title">Saved legislation.</h1><p class="subtitle">Keep interesting proposals close for later reading.</p><div class="grid billgrid">${bills.filter(b=>state.saved.includes(b.id)).map(cardBill).join('')||'<div class="card empty">No saved bills yet. Open Legixsplain and tap ♡ to bookmark a proposal.</div>'}</div>`}
function modal(){if(!state.modal)return '';if(state.modal==='notifications')return `<div class="modalback" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Notifications"><div class="modal-head"><h2>Notifications</h2><button class="close" data-close="1">✕</button></div><div class="notification"><strong>✦ Your daily challenge is ready</strong><p>Take one minute to build your civic knowledge today.</p></div><div class="notification"><strong>▤ Explore sample legislation</strong><p>Six fictional proposals are ready to explore in Legixsplain.</p></div><div class="source-note" style="margin-top:15px">These are demonstration notifications. Live alerts and voter registration deadlines are not yet connected.</div></div></div>`;let rep=reps.find(r=>r.id===state.repId)||reps[0];return `<div class="modalback" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Contact representative"><div class="modal-head"><h2>Message ${rep.name}</h2><button class="close" data-close="1">✕</button></div><p>Draft a respectful message to your representative. Engage will not send it in this prototype.</p><label style="font-size:12px;font-weight:800">Your message</label><textarea id="messageText">Dear Representative ${rep.name},\n\nI am writing as a constituent about an issue important to me.\n\n</textarea><p style="font-size:11px">No email or government contact integration has been connected. You can copy this draft.</p><button class="btn primary" id="copyMessage">Copy message</button></div></div>`}
function toast(msg){let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function render(){const titles={home:'Overview',bills:'Legixsplain',detail:'Legixsplain',reps:'Representatives',repdetail:'Representative profile',pulse:'Public Pulse',daily:'Daily Engagement',saved:'Saved bills'};document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="logo"><span>✦</span></div>engage<span style="color:#1d6ddd">.</span></div><div class="navlabel">YOUR ENGAGE</div>${nav('home','Dashboard')}${nav('bills','Legixsplain')}${nav('reps','Representatives')}${nav('pulse','Public Pulse')}${nav('daily','Daily Engagement')}<div class="navlabel" style="margin-top:25px">YOUR SPACE</div>${nav('saved','Saved bills')}<div class="sidebar-bottom"><div class="demo-pill">ⓘ DEMO · Sample data only</div><div class="profile"><div class="avatar">C</div><div><strong>Citizen</strong><small>New York · Demo profile</small></div></div></div></aside><main class="main"><header class="topbar"><div class="topbar-title">${titles[state.page]||'Engage'}</div><div class="topbar-right"><span class="jurisdiction">⌖ New York · Demo</span><button class="circlebtn" data-notify="1" aria-label="Notifications">♧<span class="dot"></span></button><div class="avatar" style="width:34px;height:34px">C</div></div></header><div class="content">${({home,bills:listBills,reps:repsPage,pulse:pulsePage,daily:dailyPage,saved:savedPage,detail:billDetail,repdetail:repDetail})[state.page]()}</div></main></div><nav class="mobile-nav">${[['home','Home'],['bills','Bills'],['reps','People'],['pulse','Pulse'],['daily','Daily']].map(([p,n])=>`<button class="${state.page===p||(state.page==='detail'&&p==='bills')||(state.page==='repdetail'&&p==='reps')?'active':''}" data-page="${p}"><span>${icon[p]}</span>${n}</button>`).join('')}</nav>${modal()}`;}
function navigate(p){state.page=p;state.modal=null;state.search='';window.scrollTo({top:0,behavior:'instant'});render()}
document.addEventListener('click',async e=>{let a=e.target.closest('[data-page],[data-bill],[data-save],[data-vote],[data-rep],[data-contact],[data-answer],[data-close],[data-notify],[data-dismiss],#submitDaily,#copyMessage');if(!a)return;if(a.dataset.dismiss&&e.target!==a)return;if(a.dataset.page){navigate(a.dataset.page)}else if(a.dataset.bill){state.billId=a.dataset.bill;navigate('detail')}else if(a.dataset.save){let id=a.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist('saved',state.saved);render();toast(state.saved.includes(id)?'Bill saved to your reading list':'Bill removed from saved list')}else if(a.dataset.vote){let [id,v]=a.dataset.vote.split(':');state.votes[id]=v;persist('votes',state.votes);render();toast('Your opinion was saved locally')}else if(a.dataset.rep){state.repId=Number(a.dataset.rep);navigate('repdetail')}else if(a.dataset.contact){state.repId=Number(a.dataset.contact);state.modal='contact';render()}else if(a.dataset.answer!==undefined&&!state.challengeDone){state.challengeAnswer=Number(a.dataset.answer);render()}else if(a.id==='submitDaily'&&state.challengeAnswer!==null){state.challengeDone=true;state.streak=Math.max(1,state.streak);persist('challengeDone',true);persist('streak',state.streak);render();toast('+30 Civic Score! Challenge complete')}else if(a.dataset.close||a.dataset.dismiss){state.modal=null;render()}else if(a.dataset.notify){state.modal='notifications';render()}else if(a.id==='copyMessage'){let message=document.getElementById('messageText').value;try{await navigator.clipboard.writeText(message);toast('Message copied to clipboard')}catch{toast('Select the message text to copy it')}}});document.addEventListener('input',e=>{if(e.target.id==='billSearch'){let i=e.target.selectionStart;state.search=e.target.value;let items=bills.filter(b=>(state.filter==='All'||b.level===state.filter||b.category===state.filter)&&(`${b.title} ${b.code} ${b.description} ${b.category}`.toLowerCase().includes(state.search.toLowerCase())));let grid=document.querySelector('.billgrid');if(grid)grid.innerHTML=items.map(cardBill).join('')||'<div class="card empty">No bills found.</div>'}});document.addEventListener('change',e=>{if(e.target.id==='billFilter'){state.filter=e.target.value;render()}});render();
</script></body></html>
